[package]
name = "suritui"
version = "0.1.0"
edition = "2021"
license = "BSD-2-Clause"
description = "A read-only terminal UI for browsing Suricata alerts over a restricted ssh account"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
crossterm = "0.29"
flate2 = "=1.1.10"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tar = "0.4.46"
toml = "=1.1.8"
ureq = { version = "=3.5.0", default-features = false, features = ["rustls"] }
