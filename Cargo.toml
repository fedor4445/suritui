[package]
name = "suritui"
version = "0.1.0"
edition = "2021"
license = "BSD-2-Clause"
repository = "https://github.com/fedor4445/suritui"
description = "A terminal UI for Suricata alerts and rule management on a FreeBSD router (read-only over ssh, or local with a small sudo helper)"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
crossterm = "0.29"
flate2 = "=1.1.10"
libc = "=0.2.191"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tar = "0.4.46"
toml = "=1.1.8"
unicode-segmentation = "1.13.3"
unicode-width = "=0.2.3"
ureq = { version = "=3.5.0", default-features = false, features = ["rustls"] }
