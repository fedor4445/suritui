# cargo-deny policy. Run it with: cargo deny check
# (the rustls chain behind ureq brings ISC, BSD-3-Clause and CDLA-Permissive-2.0; all are permissive)

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "CDLA-Permissive-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

[bans]
# Two versions of one crate are common in a tree like this; warn, do not fail.
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
